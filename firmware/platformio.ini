[env:boite]
; pioarduino : le successeur communautaire du platform officiel, qui apporte
; arduino-esp32 3.x et un compilateur C++20. Le platform officiel est reste
; sur un toolchain trop ancien pour la bibliotheque audio.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 ---------------------------------------------------------------
; memory_type active la PSRAM octale embarquee.
; flash_size DOIT passer par board_upload : c'est cette cle qui atterrit dans
; l'en-tete de l'image. Avec board_build.flash_size, le bootloader garde les
; 8 Mo par defaut du board, voit une table de partitions qui deborde, et
; redemarre en boucle sans afficher la moindre ligne.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv
board_build.filesystem          = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Serial sort sur l'UART0, donc sur le port USB pilote par la puce CH343.
  ; Ce port survit aux resets et aux plantages, contrairement a l'USB natif.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
; Aucun port fige : PlatformIO trouve seul la carte branchee. Si la machine en
; voit plusieurs, remplir upload_port et monitor_port avec le bon /dev/cu.*
upload_port   =
monitor_port  =

lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git
  bblanchon/ArduinoJson@^7.0.0
  greiman/SdFat@^2.2.2

; La carte imprimee : meme code, brochage permute pour le routage, et surtout
; une puce plus petite. Le module retenu est un WROOM-1-N8R2 : 8 Mo de flash, la
; moitie du prototype. La table a 16 Mo heritee ci-dessus ne rentrerait pas et la
; carte ne demarrerait pas, exactement le piege documente plus haut, dans
; l'autre sens. Avec 8 Mo, les deux emplacements de programme tombent a 3,3 Mo
; chacun pour un micrologiciel qui en occupe deja 2,6 : la mise a jour par le
; reseau tient, mais la marge est mince et se surveille.
[env:carte]
extends = env:boite

; Le module de la carte est un WROOM-1-N8R2 : sa PSRAM est de 2 Mo en QUAD,
; la ou le prototype porte 8 Mo en OCTAL. Herite tel quel, le reglage octal du
; prototype fait chercher la memoire sur un bus qui n'existe pas ici : la
; PSRAM reste introuvable et la bibliotheque audio, qui exige de la PSRAM,
; noie la console d'erreurs d'allocation sans jamais dire pourquoi.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size    = 8MB
board_upload.maximum_size  = 8388608
board_build.partitions     = default_8MB.csv

; La carte n'a PAS de puce CH343. L'USB-C va directement sur l'USB natif du
; processeur, IO19 et IO20. Il faut donc que Serial sorte par la, sans quoi la
; console serait muette et la carte paraitrait morte au premier branchement :
; CDC_ON_BOOT passe a 1, alors que le prototype le veut a 0.
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCARTE_IMPRIMEE

; Aucun port fige : celui du prototype est le numero de serie de SA puce CH343.
; Chaque carte imprimee apparaitra sous un nom different, et PlatformIO sait le
; trouver seul.
upload_port  =
monitor_port =
